name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Update affected dependencies
        run: |
          cargo update -p anyhow --precise 1.0.103
          cargo update -p quinn-proto --precise 0.11.15
          cargo update -p rustls-webpki --precise 0.103.13
          cargo update -p rand@0.9.2 --precise 0.9.3

      - name: Run cargo-audit
        run: cargo audit --deny warnings

      - name: Upload patched lockfile
        uses: actions/upload-artifact@v4
        with:
          name: patched-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
