name: Consolidate dependencies

on:
  push:
    branches:
      - chore/consolidate-dependency-updates

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/consolidate-dependency-updates

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Update lockfile
        run: |
          cargo update -p chrono --precise 0.4.45
          cargo update -p serde_json --precise 1.0.150
          cargo update -p clap --precise 4.6.1
          cargo update -p shlex --precise 2.0.1
          cargo update -p rand@0.9.3 --precise 0.9.4

      - name: Validate
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release

      - name: Commit lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): refresh consolidated lockfile"
          git push origin HEAD:chore/consolidate-dependency-updates
