[package]
name = "gbyctl"
version = "0.5.6"
edition = "2024"
rust-version = "1.94"
description = "Ubuntu-focused Linux operations assistant with bounded workflows"
license = "MIT"
repository = "https://github.com/dwizzle204/gbyctl"
readme = "README.md"
keywords = ["ubuntu", "ops", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3.6", default-features = false, features = ["linux-native"] }
aes-gcm-siv = "0.11"
getrandom = "0.3"
base64 = "0.22"
shlex = "1.3"

[dev-dependencies]
tempfile = "3.27"

[package.metadata.deb]
name = "gbyctl"
maintainer = "Gibby Maintainers"
copyright = "2026"
license-file = ["LICENSE", "0"]
extended-description = "Ubuntu-focused Linux operations assistant with bounded workflows"
depends = "$auto"
section = "admin"
priority = "optional"
assets = [
  ["target/release/gbyctl", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/gbyctl/README", "644"],
]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unused_results = "deny"
future_incompatible = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
print_stderr = "deny"
